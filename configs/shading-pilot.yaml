# Pilot for the contribution: texel-L2 QAT vs texel + shading-loss QAT at
# equal memory, 4-bit formats, mid-size grid. Decides whether the full
# ablation (P1) is worth running.
name: shading-pilot

train:
  steps: 20000
  qat_start: 0.7

grids:
  m: [[4, 16], [8, 16]]

losses:
  texel: {w_texel: 1.0, w_shading: 0.0}
  shade1: {w_texel: 1.0, w_shading: 1.0}
  shade4: {w_texel: 1.0, w_shading: 4.0}

sweep:
  material: [metal_plate, rough_wood, castle_brick_07]
  grids: [m]
  loss: [texel, shade1, shade4]
  fmt: [mxfp4, nvfp4, mxfp8]
