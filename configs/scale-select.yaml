# Block-scale selection at 4 bits: spec max-abs rule vs MSE-optimal scale vs
# loss-sensitivity-weighted scale (no extra storage: same 1 scale per block).
# With the texel loss, "weighted" uses texel sensitivity (an ML baseline);
# with the shading loss it uses rendered-image sensitivity (our candidate).
name: scale-select

train:
  steps: 20000
  qat_start: 0.7

grids:
  m: [[4, 16], [8, 16]]

losses:
  texel: {w_texel: 1.0, w_shading: 0.0}
  shade4: {w_texel: 1.0, w_shading: 4.0}

sweep:
  material: [metal_plate, rough_wood, castle_brick_07]
  grids: [m]
  loss: [texel, shade4]
  fmt: [mxfp4, nvfp4]
  scale_mode: [max, mse, weighted]
