[workspace]
name = "sixteen-wide"
description = "Sixteen Wide: block-scaled neural texture compression with shading-aware quantization"
channels = ["conda-forge"]
platforms = [{ name = "linux-64-cuda", platform = "linux-64", cuda = "12" }]

[dependencies]
python = "3.12.*"
numpy = ">=2"
matplotlib = ">=3.9"
pandas = ">=2.2"
pyyaml = ">=6"
pillow = ">=10"
imageio = ">=2.34"
pytest = ">=8"
cuda-version = "12.9.*"
pytorch = { version = ">=2.7", build = "cuda*" }
tabulate = ">=0.10.0,<0.11"
cuda-nvcc = "12.9.*"
cuda-cudart-dev = "12.9.*"
ninja = ">=1.13.2,<2"
libcusparse-dev = "*"
libcublas-dev = "*"
libcusolver-dev = "*"
libcurand-dev = "*"
libcufft-dev = "*"
pyassimp = ">=5.2.5,<6"

[pypi-options]
no-build-isolation = ["nvdiffrast"]

[pypi-dependencies]
flip-evaluator = ">=1.6"
nvdiffrast = { git = "https://github.com/NVlabs/nvdiffrast", tag = "v0.4.0" }

[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/python"

[tasks]
fetch = "python tools/fetch_polyhaven.py"
test = "python -m pytest -q python/tests"
sweep = "python -m sixteen.sweep"
figures = "python -m sixteen.figures"
